name: ecosync_cropguard
description: Offline-first crop disease diagnostic app for Zimbabwean smallholder farmers.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3             # SQLite interface
  path: ^1.9.0                # Path utilities for DB file location
  path_provider: ^2.1.3       # Locate app documents directory
  provider: ^6.1.2            # State management
  flutter_svg: ^2.0.10        # SVG asset support (crop icons, logo)
  photo_view: ^0.15.0         # Pinch-to-zoom full-screen image viewer
  shared_preferences: ^2.3.2  # Persist the user's chosen theme colour

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4          # Real SQLite (no platform channel) for host-run unit tests
  path_provider_platform_interface: ^2.1.2  # Lets unit tests fake getApplicationDocumentsDirectory()

flutter:
  uses-material-design: true

  assets:
    - assets/db/cropguard.db
    - assets/images/maize/
    - assets/images/tobacco/
    - assets/images/groundnuts/
    - assets/images/sorghum/
    - assets/images/sweet_potatoes/
    - assets/branding/
    - assets/branding/crop_icons/
